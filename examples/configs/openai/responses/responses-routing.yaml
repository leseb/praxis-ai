# Responses API Mode Routing
#
# Routes Responses API traffic by detected mode. The `openai_responses_format`
# filter classifies requests as `stateless` (simple inference, no
# state management) or `stateful` (needs conversation history, tools,
# or persistence).
#
# Both modes use the same inference endpoint through distinct logical clusters.
# Stateful-only filters can be conditioned on the promoted mode header before
# the shared load balancer as orchestration and persistence are added.
#
# A request is stateful if any of:
# - previous_response_id is set
# - tools array is non-empty
# - store is true (the OpenAI spec default when omitted)
# - conversation is set
# - prompt.id is set
#
# Stateless requires store=false and no other stateful markers.

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [responses-routing]

filter_chains:
  - name: responses-routing
    filters:
      - filter: openai_responses_format
        on_invalid: reject
        headers:
          mode: x-praxis-responses-mode

      # Validate before routing so both modes share the fail-closed background
      # policy. Body filters cannot be placed inside branch chains.
      - filter: openai_responses_validate
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-praxis-responses-mode: "stateful"
            cluster: "stateful-inference-backend"
          - path_prefix: "/"
            cluster: "inference-backend"
      - filter: load_balancer
        clusters:
          - name: "inference-backend"
            endpoints:
              - "127.0.0.1:3001"
          - name: "stateful-inference-backend"
            endpoints:
              - "127.0.0.1:3001"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
