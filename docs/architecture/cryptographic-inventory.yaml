# Machine-readable cryptographic inventory for the Praxis AI proxy (#1220).
# This manifest is the AUTHORITATIVE source of record; the prose companion
# cryptographic-inventory.md is GENERATED from it by
# `cargo xtask check-crypto-inventory --fix` — never hand-edit the .md.
#
# The AI proxy ships two build profiles and the inventory tracks BOTH:
#   * full — the published container image (`PRAXIS_AI_FEATURES ?= full`,
#     `standard` + `openai-all` + `store-postgres`);
#   * fips — the reduced FIPS runtime, built `--no-default-features` with the
#     feature set shared from `xtask/src/fips.rs::FIPS_FEATURES`
#     (openai-responses,aws-sigv4-filter).
# Every `production` crate and every pinned `providers` entry declares the
# `profiles:` it is resolved in.
#
# Verified by `cargo xtask check-crypto-inventory` (run from `make lint`), which
# resolves the runtime graph of each profile:
#   cargo tree -p praxis-ai-proxy --edges normal \
#     --no-default-features --features <profile> --target <triple>
# on all three tier-1 targets (x86_64-unknown-linux-gnu, aarch64-apple-darwin,
# x86_64-pc-windows-msvc) — six graphs in all — so the result is host-independent
# and CI validates the macOS/Windows and FIPS declarations even though it runs on
# Linux/full. The edge and runtime-linkage graphs are keyed on package IDENTITY
# (name + version), so two co-resolved versions of one crate are never merged. It
# fails if:
#   * a crate appears in more than one classification list — production/allow/
#     proc_macro/test_only/build_only — or a provider spills outside `production`
#                                                       (duplicate classification);
#   * a `platform:`-tagged entry names an OS outside {linux, macos, windows}
#                                                       (unknown platform);
#   * a `production` entry or `providers` entry declares no `profiles`, or one
#     outside {full, fips}; or a non-`production` bucket declares `profiles`
#                                                       (profile misfile);
#   * a crate whose name matches `watch_tokens` appears in a target's tree but is
#     declared for that platform in none of `production`, `allow`, `proc_macro`,
#     or `build_only` — a `platform:`-tagged entry only covers its own target
#                                                       (undeclared crypto);
#   * a `production` entry is absent from a (profile, target) it applies to
#                                                       (stale declaration);
#   * a `production` entry is present in a graph whose profile it does NOT declare
#                                                       (profile leak);
#   * an `allow` entry is absent from every platform-matching runtime graph
#                                                       (stale exception);
#   * a `production` entry has no `disposition`, or one outside the documented
#     set                                               (unclassified);
#   * a `providers:` entry drifts: wrong version, a missing `require_features`,
#     or a present `forbid_features` — unlisted extra features are allowed by
#     design                                            (provider drift);
#   * a `proc_macro` entry is not actually a `(proc-macro)` in the graph, or a
#     `production`/`allow` entry IS a proc-macro         (proc-macro misfile);
#   * a `production`/`allow` entry resolves only beneath a proc-macro subtree, so
#     it is not linked into the runtime binary            (runtime-linkage misfile);
#   * a `test_only` or `build_only` crate is actually linked into any target's
#     runtime binary (reachable from the root without crossing a proc-macro node)
#                                                       (containment regression);
#   * a crate on Red Hat's FIPS denylist (shared from
#     `xtask/src/fips/graph.rs::DENIED`) appears in any `fips` graph
#                                                       (FIPS denylist).
#
# `watch_tokens` are matched against each crate name after splitting on '-' and
# '_' and stripping trailing digits from each part (so `sha2` -> `sha`,
# `md-5` -> `md`, `chacha20` -> `chacha`). Tokens with no current match are kept
# to catch future crypto crates.

watch_tokens:
  - sha
  - sha1
  - sha2
  - sha3
  - md
  - md5
  - hmac
  - hkdf
  - blake
  - ring
  - aes
  - rsa
  - dsa
  - ecdsa
  - ecdh
