  # token above, so they are matched as whole crate names: libsecp256k1
  # (`secp256k1` glued to a `lib` prefix), xsalsa20poly1305 (NaCl secretbox
  # XSalsa20-Poly1305 AEAD), schnorrkel (sr25519 Schnorr signatures).
  - libsecp256k1
  - xsalsa20poly1305
